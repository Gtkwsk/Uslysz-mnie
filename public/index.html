<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f0eb;--card:#fff;--ac:#e07842;--acd:#c45a24;--acl:#fce8db;--tx:#1a1512;--ts:#4a4038;--tm:#8a7e74;--bd:#e0d8d0;--sp:#f7efe6;--gn:#1a8a5a;--gl:#d4f5e4;--rd:#d94040;--rl:#fde0e0;--wm:#fdf4ec;--pp:#7c5cbf;--pl:#f0ebfa;--pd:#4a3580;--teal:#1a9a8a}
body{font-family:'Lora',serif;background:var(--bg);color:var(--tx);min-height:100dvh;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;padding:0 18px 44px;min-height:100dvh}
@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes sr{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(26,138,90,.4)}70%{box-shadow:0 0 0 18px rgba(26,138,90,0)}100%{box-shadow:0 0 0 0 rgba(26,138,90,0)}}
@keyframes confetti-fall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(60px) rotate(360deg);opacity:0}}
.scr-glow{animation:sr .6s cubic-bezier(.34,1.56,.64,1) both, glow 1.2s ease-out .6s both}
.confetti-wrap{position:relative;display:flex;justify-content:center;margin:10px auto 6px}
.confetti{position:absolute;width:6px;height:6px;border-radius:50%;animation:confetti-fall 1.2s ease-out forwards;opacity:0}
.teen-react{display:flex;align-items:flex-end;gap:10px;max-width:85%}
.teen-avatar{font-size:28px;flex-shrink:0;margin-bottom:4px}
.teen-bubble{background:#fff;border-radius:18px 18px 18px 4px;padding:12px 16px;box-shadow:0 1px 4px rgba(0,0,0,.08);position:relative}
.teen-bubble p{font-size:15.5px;line-height:1.5;color:var(--ts);font-style:italic;margin:0}
.teen-bubble .teen-name{font-size:11px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;font-style:normal;font-family:'Source Sans 3',sans-serif}
@keyframes typingDot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.typing-dots{display:flex;gap:4px;padding:4px 0}
.typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--ac);opacity:.3;animation:typingDot 1.2s ease-in-out infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
.streak-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#fff3e0,#ffe0b2);border-radius:20px;padding:6px 14px;font-family:'Source Sans 3',sans-serif;font-size:14px;font-weight:600;color:#e65100;margin-bottom:12px}
.hist-item{background:var(--card);border-radius:14px;border:1px solid var(--bd);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.hist-ctx{font-size:13px;color:var(--tm);line-height:1.4;font-family:'Source Sans 3',sans-serif}
.hist-resp{font-size:14px;color:var(--ts);font-style:italic;line-height:1.45}
.hist-meta{display:flex;justify-content:space-between;align-items:center}
.hist-score{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Source Sans 3',sans-serif;font-size:13px;font-weight:700;flex-shrink:0}
.hist-date{font-family:'Source Sans 3',sans-serif;font-size:12px;color:var(--tm)}
.hist-empty{text-align:center;padding:40px 20px;color:var(--tm);font-size:15px}
.custom-intro{background:var(--wm);border-radius:14px;padding:14px 18px;margin-bottom:16px;border-left:3.5px solid var(--pp)}.custom-intro p{font-size:14px;line-height:1.55;color:var(--ts)}
.menu-link{background:none;border:none;color:var(--ac);font-size:14px;cursor:pointer;font-family:'Source Sans 3',sans-serif;font-weight:600;padding:8px 0;display:flex;align-items:center;gap:6px}
.fu{animation:fu .5s ease-out both}.fu1{animation:fu .5s ease-out .1s both}.fu2{animation:fu .5s ease-out .2s both}.fu3{animation:fu .5s ease-out .3s both}
.fd0{animation:fu .5s ease-out both}
.fd1{animation:fu .5s ease-out .6s both}
.fd2{animation:fu .5s ease-out .8s both}
.fd3{animation:fu .5s ease-out 1.2s both}
.fd4{animation:fu .5s ease-out 1.5s both}
.fd5{animation:fu .5s ease-out 2.0s both}
.fd6{animation:fu .5s ease-out 2.5s both}
.fd7{animation:fu .5s ease-out 2.8s both}
.fd8{animation:fu .5s ease-out 3.2s both}
.sc-quote{animation:fu .6s ease-out .6s both}
.sc-input{animation:fu .5s ease-out 1.2s both}
.ss{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:10px 0}.si0{text-align:center;width:100%}
.logo{font-size:48px;margin-bottom:6px;filter:drop-shadow(0 3px 10px rgba(224,120,66,.35))}
h1{font-size:28px;font-weight:700;color:var(--acd);margin-bottom:4px;letter-spacing:-.5px}
.st{font-size:16px;color:var(--ts);margin-bottom:16px;line-height:1.4}
.ib{background:var(--wm);border-radius:14px;padding:14px 18px;margin-bottom:16px;border-left:3.5px solid var(--ac);text-align:left}
.ib p{font-size:15px;line-height:1.55;color:var(--ts)}
.lp{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.lb{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;cursor:pointer;text-align:left;transition:all .2s;font-family:inherit}
.lb.a{border-color:var(--ac);background:var(--acl);box-shadow:0 0 0 2.5px rgba(224,120,66,.2)}
.lb .e{font-size:22px;flex-shrink:0}.lb .l{font-family:'Source Sans 3',sans-serif;font-size:15.5px;font-weight:600}.lb .d{font-size:13px;color:var(--tm);margin-top:2px;font-family:'Source Sans 3',sans-serif}
.bp{width:100%;padding:14px 0;background:var(--ac);color:#fff;border:none;border-radius:14px;font-size:17px;font-weight:600;cursor:pointer;font-family:'Source Sans 3',sans-serif;transition:opacity .2s,transform .1s}
.bs{width:100%;padding:12px 0;background:transparent;color:var(--ac);border:1.5px solid var(--ac);border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Source Sans 3',sans-serif;transition:opacity .2s;margin-top:8px}
.bp:active{transform:scale(.98)}.bp:disabled{opacity:.45}
.bp-ghost{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}.bp-ghost:active{background:var(--acl)}
.tb{display:flex;justify-content:space-between;align-items:center;padding:16px 0 10px}
.bb{background:none;border:none;color:var(--ac);font-size:18px;cursor:pointer;font-family:'Source Sans 3',sans-serif;font-weight:600}
.tl{font-family:'Source Sans 3',sans-serif;font-size:14px;color:var(--tm);font-weight:600}
.stb{display:flex;justify-content:space-around;padding:12px 0 18px;border-bottom:1px solid var(--bd);margin-bottom:18px}
.si{display:flex;flex-direction:column;align-items:center}
.sn{font-family:'Source Sans 3',sans-serif;font-size:22px;font-weight:700;color:var(--acd)}
.sl2{font-family:'Source Sans 3',sans-serif;font-size:12px;color:var(--tm);margin-top:3px}
.sc{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 2px 20px rgba(26,21,18,.07)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sg{font-family:'Source Sans 3',sans-serif;font-size:14px;font-weight:600;color:var(--ts)}
.ss2{font-size:16.5px;line-height:1.65;color:var(--ts);margin-bottom:18px}
.spb{background:var(--sp);border-radius:18px;border-top-left-radius:4px;padding:18px 20px;margin-bottom:22px}
.spn{font-family:'Source Sans 3',sans-serif;font-size:13px;font-weight:700;color:var(--ac);margin-bottom:8px}
.spt{font-size:19px;font-weight:600;line-height:1.5;font-style:italic}
.ra{border-top:1px solid var(--bd);padding-top:18px}
.rl{font-family:'Source Sans 3',sans-serif;font-size:16px;font-weight:600;color:var(--ts);display:block;margin-bottom:12px}
.ta{width:100%;padding:15px 18px;border-radius:14px;border:1.5px solid var(--bd);font-size:17px;line-height:1.5;font-family:'Lora',serif;background:var(--bg);color:var(--tx);resize:vertical;outline:none}
.ta:focus{border-color:var(--ac)}.ta::placeholder{color:var(--tm)}
.snb{width:100%;margin-top:12px;padding:15px 0;background:var(--ac);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;font-family:'Source Sans 3',sans-serif}.snb:disabled{opacity:.4}
.fw{display:flex;flex-direction:column;gap:16px}
.scr{display:flex;flex-direction:column;align-items:center;justify-content:center;width:106px;height:106px;border-radius:50%;margin:10px auto 6px;color:#fff;animation:sr .6s cubic-bezier(.34,1.56,.64,1) both}
.scrn{font-family:'Source Sans 3',sans-serif;font-size:30px;font-weight:800}.scrw{font-family:'Source Sans 3',sans-serif;font-size:13px;font-weight:600;margin-top:2px}
.pb{display:flex;align-items:flex-start;gap:12px;background:var(--gl);border-radius:16px;padding:16px 18px}.pb p{font-size:16px;line-height:1.5;color:var(--gn);font-weight:600}
.trb{display:flex;align-items:center;gap:12px;background:var(--rl);border-radius:14px;padding:12px 16px}.trb span{font-family:'Source Sans 3',sans-serif;font-size:15px;font-weight:600;color:var(--rd)}
.eb{background:var(--wm);border-radius:14px;padding:14px 18px}.ebl{font-family:'Source Sans 3',sans-serif;font-size:13px;color:var(--tm);margin-bottom:5px;font-weight:600}.ebt{font-size:16px;line-height:1.5;color:var(--ts);font-style:italic}
.sec{background:var(--card);border-radius:14px;border:1px solid var(--bd);overflow:hidden}
.sech{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none;-webkit-user-select:none}.sech:active{background:rgba(0,0,0,.02)}.sech .tt{font-family:'Source Sans 3',sans-serif;font-size:16px;font-weight:600;flex:1}.sech .ch{font-size:12px;color:var(--tm);transition:transform .2s}.sech .ch.o{transform:rotate(180deg)}
.secb{font-size:16px;line-height:1.65;color:var(--ts);padding:0 16px 16px}
.rfb{display:flex;align-items:flex-start;gap:12px;background:var(--pl);border-radius:16px;padding:16px 18px;border-left:3.5px solid var(--pp)}.rfb p{font-size:16px;line-height:1.5;color:var(--pd);font-weight:500;font-style:italic}
.sgl{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}.sgi{display:flex;flex-direction:column;gap:3px}.sgla{font-family:'Source Sans 3',sans-serif;font-size:12px;font-weight:700;color:var(--ac);flex-shrink:0}.sglt{font-size:16px;color:var(--ts);line-height:1.45;font-style:italic}
@keyframes dotd-shine{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes dotd-glow{0%,100%{box-shadow:0 0 12px rgba(234,176,32,.25)}50%{box-shadow:0 0 24px rgba(234,176,32,.45)}}
@keyframes dotd-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.dotd-card{background:linear-gradient(135deg,#fffdf5 0%,#fef6de 50%,#fdf0c8 100%);border:2px solid #e8c840;border-radius:20px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden;animation:dotd-glow 3s ease-in-out infinite;cursor:pointer;transition:transform .15s}
.dotd-card:active{transform:scale(.98)}
.dotd-card::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.4) 50%,transparent 100%);background-size:200% 100%;animation:dotd-shine 4s ease-in-out infinite;pointer-events:none;border-radius:18px}
.dotd-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dotd-label{font-family:'Source Sans 3',sans-serif;font-size:13px;font-weight:700;color:#8a6d00;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.dotd-timer{font-family:'Source Sans 3',sans-serif;font-size:12px;color:#a08830;font-weight:600}
.dotd-preview{font-size:14px;color:#5a4a20;line-height:1.5;margin-bottom:8px;font-style:italic}
.dotd-cta{font-family:'Source Sans 3',sans-serif;font-size:14px;font-weight:700;color:#8a6d00;display:flex;align-items:center;gap:4px}
.dotd-done{display:flex;align-items:center;gap:10px}
.dotd-done-score{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Source Sans 3',sans-serif;font-size:15px;font-weight:800;flex-shrink:0}
.dotd-done-text{font-family:'Source Sans 3',sans-serif;font-size:13px;color:#5a4a20;line-height:1.4}
.dotd-share-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 0;background:linear-gradient(135deg,#e8c840,#d4a820);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Source Sans 3',sans-serif;transition:opacity .2s;margin-top:10px}.dotd-share-btn:active{opacity:.85}
.dotd-scene .sc{border:2px solid #e8c840;box-shadow:0 2px 24px rgba(234,176,32,.15)}
.dotd-scene .sh{border-bottom:1px solid rgba(232,200,64,.3);padding-bottom:12px;margin-bottom:14px}
.dotd-badge{background:linear-gradient(135deg,#e8c840,#d4a820);color:#fff;padding:4px 12px;border-radius:20px;font-family:'Source Sans 3',sans-serif;font-size:12px;font-weight:700;letter-spacing:.5px}
.dotd-result{background:linear-gradient(135deg,#fffdf5,#fef6de);border:2px solid #e8c840;border-radius:20px;padding:24px 20px;text-align:center;margin-bottom:16px}
.dotd-result h3{font-family:'Source Sans 3',sans-serif;font-size:13px;font-weight:700;color:#8a6d00;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.share-card{background:linear-gradient(135deg,#1a1512 0%,#2a2520 100%);border-radius:20px;padding:24px 20px;text-align:center;margin:16px 0;position:relative;overflow:hidden}
.share-card::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,rgba(232,200,64,.08),transparent 60%);pointer-events:none}
.share-grid{display:flex;justify-content:center;gap:20px;margin:16px 0}
.share-cell{text-align:center}
.share-cell .val{font-family:'Source Sans 3',sans-serif;font-size:24px;font-weight:800;color:#e8c840}
.share-cell .lbl{font-family:'Source Sans 3',sans-serif;font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
.share-divider{width:1px;background:rgba(255,255,255,.12);margin:0 4px}
.share-copy{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 0;background:linear-gradient(135deg,#e8c840,#d4a820);color:#1a1512;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Source Sans 3',sans-serif;margin-top:12px;transition:all .2s}.share-copy:active{transform:scale(.97)}
.share-copied{background:var(--gn)!important;color:#fff!important}
@keyframes badge-unlock{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.3) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes badge-shine{0%{filter:brightness(1)}50%{filter:brightness(1.3)}100%{filter:brightness(1)}}
.onb-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .4s ease-out}
.onb-inner{text-align:center;max-width:400px;width:100%}
.onb-icon{font-size:56px;margin-bottom:16px;filter:drop-shadow(0 3px 12px rgba(224,120,66,.3))}
.onb-title{font-size:22px;font-weight:700;color:var(--acd);margin-bottom:16px;line-height:1.3}
.onb-text{font-size:17px;line-height:1.7;color:var(--ts);margin-bottom:24px;text-align:left;padding:0 4px}
.onb-dots{display:flex;justify-content:center;gap:8px;margin-bottom:24px}
.onb-dot{width:8px;height:8px;border-radius:50%;background:var(--bd);transition:all .3s}
.onb-dot.active{background:var(--ac);transform:scale(1.3)}
.onb-highlight{background:var(--wm);border-radius:16px;padding:18px 20px;border-left:3.5px solid var(--ac);margin:20px 0;text-align:left}
.onb-highlight p{font-size:15.5px;line-height:1.7;color:var(--ts)}
.onb-vs{display:flex;gap:12px;margin:16px 0;text-align:left}
.onb-good,.onb-bad{flex:1;border-radius:14px;padding:14px 16px}
.onb-good{background:var(--gl)}.onb-bad{background:var(--rl)}
.onb-good .ovl{font-family:'Source Sans 3',sans-serif;font-size:12px;font-weight:700;color:var(--gn);margin-bottom:6px}
.onb-bad .ovl{font-family:'Source Sans 3',sans-serif;font-size:12px;font-weight:700;color:var(--rd);margin-bottom:6px}
.onb-good p{font-size:15.5px;line-height:1.5;font-style:italic;color:var(--gn)}
.onb-bad p{font-size:15.5px;line-height:1.5;font-style:italic;color:var(--rd)}
.onb-demo-card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 2px 20px rgba(26,21,18,.07);text-align:left;margin:16px 0}
.onb-demo-result{border-radius:16px;padding:18px;margin:16px 0;text-align:center}
.onb-demo-result.good{background:var(--gl);border:1.5px solid var(--gn)}
.onb-demo-result.meh{background:var(--wm);border:1.5px solid var(--ac)}
.onb-demo-result .dr-icon{font-size:32px;margin-bottom:6px}
.onb-demo-result .dr-text{font-size:15px;line-height:1.5;color:var(--ts);font-style:italic}
.onb-skip{background:none;border:none;color:var(--tm);font-size:13px;cursor:pointer;font-family:'Source Sans 3',sans-serif;margin-top:12px;text-decoration:underline}
.notif-banner{background:linear-gradient(135deg,#f0f7ff,#e3f0ff);border:1.5px solid #a0c8f0;border-radius:18px;padding:18px 20px;margin:16px 0;text-align:center;animation:fu .5s ease-out both}
.notif-banner-title{font-family:'Source Sans 3',sans-serif;font-size:15px;font-weight:700;color:#2060a0;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:6px}
.notif-banner-text{font-size:14px;color:#4a7aaa;line-height:1.5;margin-bottom:14px}
.notif-btns{display:flex;gap:10px;justify-content:center}
.notif-yes{background:#2060a0;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-family:'Source Sans 3',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}.notif-yes:active{transform:scale(.96)}
.notif-later{background:none;border:none;color:#6a9ac0;font-family:'Source Sans 3',sans-serif;font-size:13px;cursor:pointer;padding:10px}
.notif-done{font-family:'Source Sans 3',sans-serif;font-size:13px;color:var(--gn);display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 0}
.badges-shelf{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 8px}
.badge-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;transition:all .2s;cursor:pointer;position:relative}
.badge-icon.locked{background:var(--bg);border:1.5px dashed var(--bd);filter:grayscale(1);opacity:.4}
.badge-icon.unlocked{background:linear-gradient(135deg,#fef6de,#fdf0c8);border:1.5px solid #e8c840;box-shadow:0 2px 8px rgba(234,176,32,.2);animation:badge-shine 3s ease-in-out infinite}
.badge-icon.fresh{animation:badge-unlock .6s cubic-bezier(.34,1.56,.64,1) both}
.badge-icon:active{transform:scale(.9)}

{id:26,lv:1,sex:"m",ctx:"16-latek od miesiąca pisał wieczorami z dziewczyną poznaną na obozie. Dziś odłożył telefon w połowie rozmowy.",says:"Pisała to samo do mojego kumpla. Te same wiadomości, słowo w słowo. Myślałem, że to coś.",emo:"rozczarowanie",dist:["żal","upokorzenie","złość"]},
{id:27,lv:1,sex:"f",ctx:"13-latka wraca ze szkoły i zamyka się w pokoju. Po godzinie wychodzi i staje w drzwiach kuchni.",says:"Powiedziałam jej jedną rzecz. Jedną. I dziś wiedziała o tym cała klasa.",emo:"żal",dist:["złość","upokorzenie","wstyd"]},
{id:28,lv:1,sex:"m",ctx:"15-latek przegląda telefon na kanapie. Pokazuje tacie zdjęcie ze stadionu.",says:"Mówili, że nie ma już biletów. A tu są we trzech na meczu. Nawet nie schowali.",emo:"żal",dist:["odrzucenie","złość","smutek"]},
{id:29,lv:1,sex:"m",ctx:"15-latek piąty raz przegląda szafę. Jutro ma pierwsze spotkanie sam na sam z dziewczyną z równoległej klasy.",says:"Nie wiem, o czym będę z nią gadał przez dwie godziny. Co, jak siądziemy i będzie cisza?",emo:"niepewność",dist:["strach","wstyd","przytłoczenie"]},
{id:30,lv:1,sex:"m",ctx:"14-latek wraca ze szkoły i zamiast jak zwykle włączyć komputer, kładzie się na łóżku w butach.",says:"Powiedziałem jej. A ona: «Nie, sorry». I poszła.",emo:"odrzucenie",dist:["wstyd","smutek","upokorzenie"]},
{id:31,lv:1,sex:"f",ctx:"16-latka pisze do przyjaciółki, patrzy na telefon i odkłada go. Trzeci raz tego wieczoru.",says:"Od kiedy ma chłopaka, na wszystko jest «potem». Przyjaźnimy się od zerówki. Teraz jestem opcją na wtedy, kiedy on nie ma czasu.",emo:"zazdrość",dist:["samotność","żal","odrzucenie"]},
{id:32,lv:1,sex:"m",ctx:"13-latek wraca od kolegi z naprzeciwka wcześniej niż zwykle. Siada na schodach w przedpokoju i nie zdejmuje kurtki.",says:"Przeprowadzają się w lipcu. Do Gdańska. Znamy się od przedszkola.",emo:"smutek",dist:["żal","samotność","bezsilność"]},
{id:33,lv:1,sex:"f",ctx:"Wieczór po siedemnastych urodzinach. 17-latka sprząta ze stołu nietknięty kawałek tortu.",says:"Nie przyszedł. Napisał o dziesiątej wieczorem, że zapomniał. Zapomniał o moich urodzinach.",emo:"żal",dist:["rozczarowanie","złość","smutek"]},
{id:34,lv:1,sex:"m",ctx:"16-latek od 16 czeka na kolegę, z którym ma jutro oddać wspólny projekt. O 20 zamyka laptopa z hukiem.",says:"Miał być o czwartej. Nie odbiera. Projekt jest na nas obu, a ja mam go zrobić sam?",emo:"złość",dist:["żal","bezsilność","rozczarowanie"]},
{id:35,lv:1,sex:"f",ctx:"14-latka wraca ze szkoły i siada przy stole. Nie wyjmuje telefonu.",says:"Słyszałam w łazience, jak mówiły, że mnie tolerują. Tolerują. Myślałam, że jesteśmy koleżankami.",emo:"upokorzenie",dist:["odrzucenie","żal","wstyd"]},
{id:36,lv:1,sex:"m",ctx:"15-latek wraca z treningu i nie odzywa się przez cały obiad. W końcu odkłada widelec.",says:"Wszyscy mówią, że to ja wygadałem o tej imprezie. A ja nawet nie wiedziałem, że była.",emo:"niesprawiedliwość",dist:["złość","żal","samotność"]},
// --- Wygląd i ciało ---
{id:37,lv:1,sex:"f",ctx:"Wieczór przed zdjęciem klasowym. 14-latka od pół godziny stoi przed lustrem w łazience.",says:"Jutro zdjęcie, a ja mam całe czoło w krostach. Będzie w albumie klasowym na zawsze.",emo:"wstyd",dist:["bezsilność","złość","smutek"]},
{id:38,lv:1,sex:"m",ctx:"15-latek wraca z pierwszej lekcji wf-u w nowym roku szkolnym. Przy obiedzie nagle się odzywa.",says:"Przez wakacje wszyscy urośli. Wszyscy oprócz mnie. Stoję w rzędzie ostatni, nawet dziewczyny są wyższe.",emo:"niepewność",dist:["wstyd","smutek","zazdrość"]},
{id:39,lv:1,sex:"f",ctx:"16-latka wraca z zajęć na basenie i od razu idzie pod prysznic. Wychodzi po bardzo długim czasie.",says:"Słyszałam, co mówili o moich udach. Myśleli, że jestem pod wodą. Nie byłam.",emo:"upokorzenie",dist:["wstyd","złość","smutek"]},
{id:40,lv:1,sex:"m",ctx:"16-latek od dwóch miesięcy codziennie ćwiczy w pokoju. Staje w kuchni w samej koszulce i rozkłada ręce.",says:"Dwa miesiące. Codziennie. I wyglądam dokładnie tak samo jak w czerwcu.",emo:"rozczarowanie",dist:["frustracja","bezsilność","wstyd"]},
{id:41,lv:1,sex:"f",ctx:"Niedzielny obiad u dziadków. 15-latka wychodzi od stołu w połowie deseru i czeka w samochodzie.",says:"Wujek musiał przy wszystkich rzucić, że mi biodra urosły. I wszyscy się śmiali, jakby to był żart.",emo:"złość",dist:["upokorzenie","wstyd","bezsilność"]},
{id:42,lv:1,sex:"m",ctx:"14-latek wraca z polskiego, na którym czytał na głos fragment lektury. W domu mówi prawie szeptem.",says:"Głos mi się załamał w środku zdania. Cała klasa w śmiech, nawet psorka się uśmiechnęła.",emo:"wstyd",dist:["upokorzenie","złość","smutek"]},
{id:43,lv:1,sex:"f",ctx:"17-latka wraca od fryzjera w czapce, choć jest ciepło. Zdejmuje ją dopiero w swoim pokoju.",says:"Miało być do ramion. Jest do ucha.",emo:"bezsilność",dist:["złość","wstyd","rozczarowanie"]},
{id:44,lv:1,sex:"m",ctx:"17-latek wraca z imprezy urodzinowej wcześniej, niż zapowiadał. Siada w kuchni i je kanapkę w milczeniu.",says:"Kumpel wchodzi i wszystkie dziewczyny patrzą na niego. Ja stoję obok i jestem powietrzem. On nawet nic nie robi.",emo:"zazdrość",dist:["niepewność","wstyd","smutek"]},
{id:45,lv:1,sex:"f",ctx:"13-latka wraca ze szkoły z bluzą zawiązaną w pasie. Od razu idzie do łazienki.",says:"Dostałam okres na matmie. Na spodniach było widać. Koleżanka powiedziała to na głos, zanim zdążyłam wstać.",emo:"wstyd",dist:["upokorzenie","złość","strach"]},
{id:46,lv:1,sex:"m",ctx:"Niedziela wieczór. 15-latek pakuje torbę na basen, wyjmuje strój, wkłada z powrotem, znów wyjmuje.",says:"Jutro pierwszy raz basen z klasą. Wszyscy mnie zobaczą bez koszulki. Wszyscy.",emo:"strach",dist:["wstyd","niepewność","przytłoczenie"]},
{id:47,lv:1,sex:"f",ctx:"Sobota, 18:40. 15-latka ma wyjść o 19 na urodziny koleżanki, na łóżku leży sześć przymierzonych i zdjętych rzeczy.",says:"Nie mam w czym iść. W tym wyglądam jak worek, w tym jak dziecko, a w tym jak nie ja.",emo:"frustracja",dist:["wstyd","niepewność","złość"]},
{id:48,lv:1,sex:"m",ctx:"13-latek wrócił wczoraj od ortodonty. Dziś przy kolacji mówi z ręką przy ustach.",says:"Nazwali mnie «metalowa szczęka». Dwa lata z tym chodzić. Nie będę się uśmiechał przez dwa lata.",emo:"smutek",dist:["wstyd","bezsilność","złość"]},
// --- Internet, telefon, gry, media społecznościowe ---
{id:49,lv:1,sex:"f",ctx:"14-latka siedzi przed komputerem i trzeci raz wpisuje hasło. Odsuwa klawiaturę.",says:"Konto przejęte. Trzy lata grania, wszystkie skiny. Support odpisał, że nic nie mogą zrobić.",emo:"bezsilność",dist:["złość","żal","rozczarowanie"]},
{id:50,lv:1,sex:"f",ctx:"15-latka wraca ze szkoły i zamyka się w pokoju. Wychodzi dopiero wieczorem, bez telefonu w ręce.",says:"Ktoś przerobił moje zdjęcie i wrzucił na klasową grupę. Wszyscy to widzieli. Ja ostatnia.",emo:"upokorzenie",dist:["wstyd","złość","bezsilność"]},
{id:51,lv:1,sex:"m",ctx:"16-latek przez tydzień montował film o swoim rowerze. Dwa dni po publikacji sprawdza statystyki i zamyka aplikację.",says:"Czterdzieści wyświetleń. Tydzień montażu. Filmik kumpla, jak je kebaba, ma dziesięć tysięcy.",emo:"rozczarowanie",dist:["frustracja","zazdrość","wstyd"]},
{id:52,lv:1,sex:"m",ctx:"Ferie zimowe. 14-latek siedzi w domu, przegląda relacje znajomych na telefonie i odkłada go z westchnieniem.",says:"Wszyscy są na nartach. Każda relacja to góry i śnieg. A ja mam relację z kanapy.",emo:"zazdrość",dist:["samotność","smutek","żal"]},
{id:53,lv:1,sex:"m",ctx:"15-latek wpada do kuchni z telefonem w ręce i co chwilę odświeża ekran.",says:"Ktoś pisze z mojego konta do wszystkich znajomych. Jakieś linki. Nie mogę się zalogować i nie wiem, co jeszcze tam wysyła.",emo:"strach",dist:["bezsilność","wstyd","złość"]},
{id:54,lv:1,sex:"m",ctx:"17-latek siedzi na kanapie i przewija telefon, nie otwierając żadnej wiadomości. Potem wyłącza go całkiem.",says:"Dwieście nieprzeczytanych. Grupa klasowa, grupa od projektu, drużyna, ekipa. Każdy czegoś chce i każdy na już.",emo:"przytłoczenie",dist:["bezsilność","frustracja","złość"]},
{id:55,lv:1,sex:"m",ctx:"Wieczór. 13-latek siedzi przy komputerze ze słuchawkami na szyi, gra jest włączona, ale on nie gra.",says:"Grają we czterech. Czekałem godzinę, aż ktoś mnie zaprosi. Widzę, że są online.",emo:"odrzucenie",dist:["samotność","smutek","żal"]},
{id:56,lv:1,sex:"f",ctx:"16-latka sprawdza telefon co kilka minut, potem kładzie go ekranem do dołu na stole.",says:"Jest online. Od trzech dni jest online i nie odpisuje. A wczoraj wrzuciła zdjęcie z innymi.",emo:"żal",dist:["odrzucenie","samotność","niepewność"]},
{id:57,lv:1,sex:"m",ctx:"17-latek wraca ze szkoły z kapturem na głowie i zdejmuje go dopiero w pokoju.",says:"Ktoś wykopał mój filmik z piątej klasy. Ten, jak śpiewam. Puścili go na rzutniku na przerwie.",emo:"wstyd",dist:["upokorzenie","złość","bezsilność"]},
{id:58,lv:1,sex:"f",ctx:"15-latka prowadzi konto z własnymi rysunkami. Pokazuje mamie telefon z cudzym profilem.",says:"To mój rysunek. Zdjęła podpis, wrzuciła jako swój i ma trzy razy więcej lajków niż ja.",emo:"niesprawiedliwość",dist:["złość","żal","bezsilność"]},
// --- Przytłoczenie i zmęczenie ---
{id:59,lv:1,sex:"m",ctx:"23:10. 16-latek wraca z korepetycji po treningu i dopiero teraz wyjmuje zeszyty z plecaka.",says:"Szkoła do czwartej, trening, korki. I teraz mam zrobić dwie prace na jutro. Kiedy niby mam spać?",emo:"przytłoczenie",dist:["bezsilność","frustracja","złość"]},
{id:60,lv:1,sex:"f",ctx:"Druga w nocy. 15-latka budzi się z twarzą na otwartym zeszycie i schodzi do kuchni po wodę, tata jeszcze nie śpi.",says:"Zasnęłam nad historią. Nie skończyłam. A o siódmej pobudka i jeszcze dwie rzeczy, których nie ruszyłam.",emo:"bezsilność",dist:["przytłoczenie","strach","frustracja"]},
{id:61,lv:1,sex:"m",ctx:"Niedziela, 21:00. 14-latek siedzi na łóżku z plecakiem obok, nie wypakował go od piątku.",says:"Jutro znowu. Weekend minął, zanim się zaczął.",emo:"smutek",dist:["przytłoczenie","bezsilność","żal"]},
{id:62,lv:1,sex:"f",ctx:"Rok przed maturą. 17-latka wraca z sobotniej pracy w kawiarni i siada na podłodze w przedpokoju.",says:"Rok do matury, trzy korki w tygodniu, praca w soboty. Mam głowę jak balon, zaraz pęknie.",emo:"przytłoczenie",dist:["bezsilność","strach","frustracja"]},
{id:63,lv:1,sex:"m",ctx:"Trzeci dzień grypy. 15-latek leży w łóżku i przegląda w telefonie wiadomości z klasowej grupy.",says:"Każdy dzień w łóżku to dwa sprawdziany więcej do nadrobienia. Dziś doszła jeszcze kartkówka. Nie wiem, jak to odrobić.",emo:"bezsilność",dist:["przytłoczenie","strach","frustracja"]},
{id:64,lv:1,sex:"m",ctx:"14-latek od tygodnia trzyma się planu nauki przyklejonego nad biurkiem. Jest 23, on dalej siedzi nad zeszytem.",says:"Zrobiłem plan. Trzymam się go co do minuty. I dalej siedzę o jedenastej, bo oni zadają, jakby każdy miał tylko ich przedmiot.",emo:"frustracja",dist:["bezsilność","przytłoczenie","złość"]},
{id:65,lv:1,sex:"m",ctx:"Środa, 6:45. 15-latek siedzi na brzegu łóżka ubrany do połowy i patrzy w ścianę.",says:"Budzę się i od razu liczę, ile mam dziś rzeczy. Dochodzę do siedmiu i nie chce mi się wstawać.",emo:"przytłoczenie",dist:["bezsilność","smutek","strach"]},
{id:66,lv:1,sex:"f",ctx:"13-latka wraca z angielskiego o 19, trzecie zajęcia tego dnia. Rzuca torbę i siada na podłodze w przedpokoju.",says:"Dziewczyny po szkole siedzą pod blokiem do wieczora. Ja mam balet, angielski, pianino. Nigdy nie mam po prostu nic.",emo:"żal",dist:["przytłoczenie","zazdrość","bunt"]},
// --- Pasje, sport, porażki i przegrane ---
{id:67,lv:1,sex:"m",ctx:"15-latek wraca z finału ligi szkolnej. Wchodzi w stroju, nie przebrał się po meczu.",says:"Jeden karny. Mój. W ostatniej minucie.",emo:"rozczarowanie",dist:["wstyd","żal","bezsilność"]},
{id:68,lv:1,sex:"f",ctx:"16-latka wraca z zawodów tanecznych z torbą na ramieniu. Stawia ją w przedpokoju i nie rozpakowuje.",says:"Czwarte. Rok treningów po pięć razy w tygodniu. Pierwsze trzy dostały puchary, ja dostałam «brawa dla wszystkich».",emo:"żal",dist:["rozczarowanie","smutek","frustracja"]},
{id:69,lv:1,sex:"m",ctx:"13-latek wraca z treningu piłki. Wchodzi i od razu rzuca buty w kąt.",says:"Trener nie wziął mnie na turniej. Wziął nowego, który trenuje od września. Ja jestem w klubie trzy lata.",emo:"niesprawiedliwość",dist:["odrzucenie","zazdrość","żal"]},
{id:70,lv:1,sex:"f",ctx:"14-latka wraca z akrobatyki z obtartymi dłońmi. Siada przy stole i ogląda je.",says:"Miesiąc robię przerzut. Cała grupa ma, ja nie. Trenerka mówi «jeszcze raz» i ja znowu leżę na macie.",emo:"frustracja",dist:["bezsilność","złość","wstyd"]},
{id:71,lv:1,sex:"m",ctx:"17-latek wraca o kulach z kontroli u ortopedy. Siada na kanapie i włącza transmisję meczu swojej drużyny.",says:"Koniec sezonu dla mnie. Oni grają, a ja oglądam ich na telefonie z kanapy. Pierwszy sezon w seniorach.",emo:"smutek",dist:["żal","zazdrość","bezsilność"]},
{id:72,lv:1,sex:"f",ctx:"14-latka wraca z międzyszkolnego konkursu piosenki. Siada w samochodzie i zakłada kaptur.",says:"Zapomniałam drugiej zwrotki. Stałam na scenie, a podkład leciał dalej. Pół szkoły to widziało.",emo:"wstyd",dist:["upokorzenie","rozczarowanie","smutek"]},
{id:73,lv:1,sex:"m",ctx:"16-latek wraca z treningu siatkówki. Zjada obiad w milczeniu i odsuwa talerz.",says:"Dostał powołanie do kadry wojewódzkiej. On. Gram z nim w jednej szóstce od trzech lat i trener nawet na mnie nie spojrzał.",emo:"zazdrość",dist:["niesprawiedliwość","rozczarowanie","żal"]},
{id:74,lv:1,sex:"f",ctx:"17-latka wraca z ostatniej próby zespołu. Wnosi gitarę do pokoju i stawia ją w kącie zamiast na stojaku.",says:"Rozpadamy się. Oni w maju piszą maturę i jadą na studia. Trzy lata grania i koniec, tak po prostu.",emo:"smutek",dist:["żal","samotność","rozczarowanie"]},
// --- Przyszłość i decyzje (profil, matura, studia, dorosłość) ---
{id:75,lv:1,sex:"m",ctx:"Marzec, ósma klasa. 14-latek wraca ze spotkania z doradcą zawodowym i kładzie na stole ulotki liceów.",says:"Wszyscy w klasie wiedzą, gdzie idą. Mat-fiz, biol-chem, technikum. Ja patrzę na te ulotki i żadna nie mówi «to ja».",emo:"niepewność",dist:["przytłoczenie","strach","wstyd"]},
{id:76,lv:1,sex:"f",ctx:"17-latka wraca z targów edukacyjnych. Przy kolacji obraca w rękach folder jednego kierunku.",says:"Wszyscy mówią, że po historii sztuki nie ma pracy. Chcę tylko tego. A co, jeśli mają rację?",emo:"niepewność",dist:["strach","przytłoczenie","bezsilność"]},
{id:77,lv:1,sex:"m",ctx:"Dzień po osiemnastych urodzinach. 18-latek siedzi w kuchni nad listą rzeczy do załatwienia, którą sam sobie rozpisał.",says:"Wszyscy wczoraj: «no, teraz jesteś dorosły». Dowód, konto, prawko, matura. Jakby o północy ktoś wcisnął przycisk.",emo:"przytłoczenie",dist:["strach","niepewność","samotność"]},
{id:78,lv:1,sex:"f",ctx:"Wrzesień, pierwsza klasa liceum. 15-latka wraca z zebrania, na którym ogłoszono listę grup rozszerzeń.",says:"Wybrałam tę szkołę dla rozszerzonego angielskiego. A teraz «grupa nie powstanie, za mało chętnych». Idę na biologię, której nie chciałam.",emo:"rozczarowanie",dist:["złość","bezsilność","żal"]},
{id:79,lv:1,sex:"m",ctx:"Niedzielny obiad u dziadków. 16-latek wraca do domu i od razu zamyka się w pokoju, wychodzi dopiero wieczorem.",says:"Każdy przy stole pytał, kim chcę być. Każdy. Mam szesnaście lat, skąd mam to wiedzieć?",emo:"frustracja",dist:["przytłoczenie","niepewność","złość"]},
{id:80,lv:1,sex:"f",ctx:"18-latka dostała wynik rekrutacji na wymarzone studia w innym mieście. Siedzi na łóżku i nikomu jeszcze nie napisała.",says:"Dostałam się. I nagle to jest za trzy miesiące, pięć godzin pociągiem, sama w obcym mieście. Dwa dni temu tego chciałam.",emo:"strach",dist:["niepewność","samotność","przytłoczenie"]},
// POZIOM 2 — kusi, żeby doradzać i naprawiać
// --- Szkoła: oceny, poprawy, konflikt z nauczycielem, odkładanie trudnej rozmowy ---
{id:81,lv:2,sex:"m",ctx:"15-latek wraca ze szkoły i kładzie sprawdzian z matematyki na stole, oceną do góry.",says:"Jedynka. I zanim powiesz: wiem, trzeba było zacząć wcześniej, nie w nocy przed.",emo:"rozczarowanie",dist:["wstyd","frustracja","bezsilność"]},
{id:82,lv:2,sex:"f",ctx:"16-latka wraca z lekcji biologii. Rzuca plecak i staje w drzwiach kuchni z założonymi rękami.",says:"Nie idę więcej na biologię. Powiedziała przy całej klasie, że z moimi wynikami to najwyżej na kasę. Nie będę tam siedzieć i tego słuchać.",emo:"upokorzenie",dist:["złość","bunt","bezsilność"]},
{id:83,lv:2,sex:"m",ctx:"14-latek od trzech dni nosi w plecaku kartkę z prośbą o poprawę sprawdzianu. Jutro mija termin zgłoszeń.",says:"Jutro ostatni dzień. Trzy razy stałem pod pokojem nauczycielskim i trzy razy zawróciłem. I wiem, że powiesz, że wystarczy wejść.",emo:"strach",dist:["niepewność","wstyd","bezsilność"]},
{id:84,lv:2,sex:"f",ctx:"17-latka od miesiąca mówi, że pójdzie do wychowawcy w sprawie zmiany rozszerzenia. Dziś znów wraca bez tej rozmowy.",says:"Znowu nie poszłam. Jak zmienię, będę pół roku za wszystkimi. Jak nie zmienię, to kolejne dwa lata chemii, której nie cierpię.",emo:"niepewność",dist:["strach","przytłoczenie","bezsilność"]},
{id:85,lv:2,sex:"m",ctx:"15-latek sprawdza Librus i odkłada telefon. Potem bierze go z powrotem i patrzy jeszcze raz.",says:"Poprawa była dziś, myślałem, że w piątek. Ona nie robi drugich terminów. Nie potrzebuję rady, mam przerąbane i tyle.",emo:"bezsilność",dist:["wstyd","strach","złość"]},

{id:140,lv:3,sex:"f",ctx:"Przy kolacji mama pyta o chłopaka, o którym 16-latka pisała tylko w prywatnej rozmowie z przyjaciółką. Ona odkłada sztućce.",says:"Skąd o nim wiesz? Nikomu nie mówiłam. Skąd?",emo:"złość",dist:["strach","upokorzenie","bezsilność"]},
{id:141,lv:3,sex:"m",ctx:"13-latek wyłącza grę, kiedy tata podchodzi z telefonem, na którym jest aplikacja pokazująca czas spędzony w grach.",says:"Masz to w telefonie, co do minuty. Czterdzieści minut. To po co pytasz, ile grałem, skoro wiesz?",emo:"frustracja",dist:["złość","upokorzenie","bunt"]},
{id:142,lv:3,sex:"f",ctx:"Mama poprosiła o hasło do telefonu „na wszelki wypadek”. 18-latka kładzie telefon na stole ekranem do dołu.",says:"Na wypadek czego? Nie dam. Jak dam, to już nigdy nie będzie moje.",emo:"bunt",dist:["złość","niesprawiedliwość","frustracja"]},
{id:143,lv:3,sex:"m",ctx:"16-latek dowiaduje się od kolegi, że tata napisał do niego z jego Discorda, żeby nie grali tak długo w nocy. Wchodzi do kuchni z telefonem.",says:"Napisałeś do Bartka. Z mojego Discorda. Wiesz, jak mnie teraz nazywają?",emo:"upokorzenie",dist:["złość","wstyd","bezsilność"]},
// --- Autonomia: wyjścia, godziny powrotu, wygląd, muzyka, własny styl ---
{id:144,lv:3,sex:"m",ctx:"16-latek dostał odmowę na koncert, na który idzie cała jego klasa. Stoi w drzwiach kuchni z biletem w ręce.",says:"Wszyscy idą, wszyscy. Rodzice każdego się zgodzili, tylko wy nie. Co jest ze mną nie tak?",emo:"niesprawiedliwość",dist:["złość","żal","bunt"]},
{id:145,lv:3,sex:"m",ctx:"Piątek, 20:50. 15-latek wraca z boiska dokładnie o godzinie wyznaczonej przez tatę, koledzy zostali.",says:"Dziewiąta. Oni siedzą do jedenastej, a ja wstaję i mówię «muszę». Jak z przedszkola.",emo:"wstyd",dist:["bunt","złość","niesprawiedliwość"]},
{id:146,lv:3,sex:"m",ctx:"Dzień przed zjazdem rodzinnym. Mama kazała ściąć włosy przed wspólnym zdjęciem, 14-latek stoi w łazience i nie dzwoni do fryzjera.",says:"Nie zetnę. To moje włosy, nie wasza dekoracja.",emo:"złość",dist:["bunt","upokorzenie","bezsilność"]},
{id:147,lv:3,sex:"f",ctx:"17-latka wychodzi z łazienki umalowana na wyjście. Tata komentuje, że wygląda „jak do klubu”.",says:"«Jak do klubu». Pół godziny to robiłam, idę do kina z koleżankami. Mam zmyć i pójść jak szara mysz, tak chcesz?",emo:"upokorzenie",dist:["złość","wstyd","żal"]},
{id:148,lv:3,sex:"m",ctx:"15-latek puścił w samochodzie swoją playlistę. Tata po minucie przełącza na radio.",says:"Minuta. Nawet nie posłuchałeś jednego kawałka do końca. «To nie muzyka», a twoja to niby muzyka?",emo:"rozczarowanie",dist:["złość","żal","odrzucenie"]},
{id:149,lv:3,sex:"f",ctx:"16-latka dostała trzeci rok z rzędu odmowę wyjazdu ze znajomymi nad jezioro. Siedzi na łóżku z otwartą listą rzeczy do spakowania.",says:"Rok temu «za rok». Dwa lata temu «za rok». Kiedy w końcu będzie ten rok?",emo:"bezsilność",dist:["złość","niesprawiedliwość","bunt"]},
{id:150,lv:3,sex:"m",ctx:"Sylwester. 17-latek szykuje się na imprezę u kolegi, mama właśnie powiedziała, że ma wrócić o 22.",says:"O dziesiątej w sylwestra? To ja w ogóle nie idę. Po co, żeby wyjść przed północą jak dzieciak?",emo:"złość",dist:["bunt","niesprawiedliwość","upokorzenie"]},
{id:151,lv:3,sex:"f",ctx:"14-latka wraca od koleżanki z pasemkiem niebieskiej farby we włosach, mimo wcześniejszego zakazu.",says:"Tak, zrobiłam. To moje włosy. Zmyje się za miesiąc, a ty robisz z tego aferę.",emo:"bunt",dist:["złość","niesprawiedliwość","wstyd"]},
{id:152,lv:3,sex:"m",ctx:"16-latek wychodzi z pokoju w nowej, szerokiej bluzie. Mama patrzy na niego i wzdycha.",says:"Nigdy ci się nie podoba nic, co jest moje. Ani ciuchy, ani muzyka, ani kumple. Nic.",emo:"odrzucenie",dist:["złość","żal","upokorzenie"]},
{id:153,lv:3,sex:"f",ctx:"13-latka dostała odmowę na nocowanie u koleżanki, bo mama nie zna jej rodziców. Siedzi na schodach z telefonem.",says:"Wszystkie będą. Ja będę w domu, jak zawsze. Nawet nie spróbowałaś ich poznać.",emo:"żal",dist:["złość","niesprawiedliwość","samotność"]},
{id:154,lv:3,sex:"m",ctx:"18-latek wychodzi na osiemnastkę kolegi. Tata w przedpokoju przypomina, że ma być w domu o pierwszej.",says:"O pierwszej, na osiemnastce? Wrócę, jak się skończy. Nie będę pierwszy wychodził, bo tata kazał.",emo:"bunt",dist:["złość","niesprawiedliwość","frustracja"]},
{id:155,lv:3,sex:"f",ctx:"16-latka wraca od fryzjera z włosami ściętymi na krótko. Mama na jej widok pyta, co ona sobie zrobiła.",says:"Co sobie zrobiłam? Ścięłam włosy, moje. I nie, nie wyglądam jak chłopak, wyglądam jak ja.",emo:"złość",dist:["upokorzenie","bunt","żal"]},
{id:156,lv:3,sex:"m",ctx:"15-latek dostał zgodę na mecz w sąsiednim mieście tylko pod warunkiem, że pojedzie z nim mama. Koledzy jadą sami pociągiem.",says:"Wszyscy jadą sami, ja z mamą jak na wycieczce z podstawówki. Mam im powiedzieć, że mama się boi, czy że ja się boję?",emo:"wstyd",dist:["upokorzenie","złość","niesprawiedliwość"]},
{id:157,lv:3,sex:"f",ctx:"16-latka dostała propozycję pracy w weekendy w kawiarni koleżanki. Tata odmówił zgody, bo „najpierw szkoła”.",says:"Mam średnią cztery osiem. Co jeszcze mam zrobić, żebyś mi uwierzył, że ogarniam? Weekend to mój czas.",emo:"frustracja",dist:["bezsilność","złość","niesprawiedliwość"]},
// --- Obowiązki i „zawsze ja” ---
{id:158,lv:3,sex:"m",ctx:"15-latek zakłada buty do wyjścia, kiedy mama woła go do wyniesienia śmieci.",says:"Znowu ja. Rano ja, wczoraj ja. Jakby w tym domu tylko ja miał ręce.",emo:"niesprawiedliwość",dist:["złość","żal","bunt"]},
{id:159,lv:3,sex:"f",ctx:"14-latka czwarty dzień z rzędu odbiera brata z przedszkola i zostaje z nim do wieczora. Mama wraca o 19.",says:"Nie jestem jego mamą. Odbieram, karmię, bawię się z nim. Kiedy ja mam czas dla siebie?",emo:"przytłoczenie",dist:["niesprawiedliwość","złość","żal"]},
{id:160,lv:3,sex:"m",ctx:"Osiemdziesiąta piąta minuta meczu Ligi Mistrzów. Mama woła do zmywania, 16-latek wstaje z pilotem w ręce.",says:"Teraz? Pięć minut do końca i akurat teraz? Zawsze w najgorszym momencie, zawsze.",emo:"złość",dist:["frustracja","niesprawiedliwość","bunt"]},
{id:161,lv:3,sex:"m",ctx:"17-latek wraca o 20 z korepetycji. Tata od progu mówi o nieposprzątanym pokoju.",says:"Wyszedłem o siódmej rano, wracam o ósmej wieczorem. Kiedy ja mam niby sprzątać? W nocy?",emo:"bezsilność",dist:["przytłoczenie","złość","żal"]},
{id:162,lv:3,sex:"m",ctx:"13-latek wraca ze spaceru z psem w deszczu. Jego siedemnastoletni brat siedzi w pokoju przy grze.",says:"Pies jest «nasz», a wychodzę z nim tylko ja. On ma siedemnaście lat i w tym tygodniu nawet smyczy nie dotknął.",emo:"niesprawiedliwość",dist:["złość","żal","frustracja"]},
{id:163,lv:3,sex:"f",ctx:"15-latka umyła podłogę w kuchni. Po chwili widzi, jak mama bierze mop i myje ją jeszcze raz.",says:"To po co ja to robiłam? Jak i tak zrobisz po mnie, to następnym razem zrób od razu.",emo:"frustracja",dist:["upokorzenie","złość","bezsilność"]},
{id:164,lv:3,sex:"m",ctx:"Piątek wieczór. Ojciec ogłasza, że w sobotę cała rodzina sprząta garaż, a 18-latek ma od tygodnia umówiony wyjazd.",says:"Nie. Mam plany od tygodnia. Nie można tak po prostu ogłosić, że moja sobota jest wasza.",emo:"bunt",dist:["złość","niesprawiedliwość","frustracja"]},
{id:165,lv:3,sex:"f",ctx:"Tata prosi o zrobienie kolacji dla rodziny. 15-latka patrzy w stronę pokoju, w którym jej szesnastoletni brat gra na konsoli.",says:"Czemu ja? Bo jestem dziewczyną? On ma dwie ręce, a nikt go nie prosi o kolację.",emo:"złość",dist:["niesprawiedliwość","bunt","upokorzenie"]},
{id:166,lv:3,sex:"m",ctx:"14-latek słucha, jak tata po raz kolejny opowiada, że sam w jego wieku pomagał od świtu w gospodarstwie. Przewraca oczami.",says:"Ty w moim wieku. Wiem, słyszałem to sto razy. Tylko że ja nie jestem tobą.",emo:"frustracja",dist:["złość","bunt","upokorzenie"]},
{id:167,lv:3,sex:"f",ctx:"13-latka wraca o 18 z zajęć, zdejmuje buty i siada na kanapie. Po minucie mama woła ją do pomocy w kuchni.",says:"Minutę. Usiadłam minutę temu. Nigdy nie mogę po prostu usiąść, zawsze coś jest do zrobienia.",emo:"przytłoczenie",dist:["żal","złość","bezsilność"]},
// --- Wstyd przez rodzica przy ludziach (żarty, zdrobnienia, wtrącanie się, czułości publicznie) ---
{id:168,lv:3,sex:"f",ctx:"Niedzielny obiad z ciocią i jej córkami. Mama opowiada przy stole, że 15-latka „ma kogoś na oku”, ona wstaje od stołu.",says:"Powiedziałam ci to w tajemnicy. W tajemnicy! A ty przy wszystkich, jakby to był żart z telewizji.",emo:"upokorzenie",dist:["złość","wstyd","żal"]},
{id:169,lv:3,sex:"m",ctx:"16-latek stoi z kolegami pod szkołą. Mama podjeżdża i przez otwarte okno woła go domowym zdrobnieniem.",says:"Nie przy ludziach. Nigdy.",emo:"wstyd",dist:["upokorzenie","złość","żal"]},
{id:170,lv:3,sex:"m",ctx:"14-latek wychodzi ze szkoły z kolegami. Tata czekający przy bramie głośno każe mu zapiąć kurtkę.",says:"«Zapnij kurtkę». Na cały chodnik. Oni będą mi to powtarzać do końca roku.",emo:"upokorzenie",dist:["wstyd","złość","bezsilność"]},
{id:171,lv:3,sex:"m",ctx:"15-latek stoi po meczu z drużyną, kiedy mama podchodzi i całuje go w czubek głowy. W samochodzie on patrzy w okno.",says:"Przy całej drużynie. W głowę. Jak pięciolatka.",emo:"złość",dist:["wstyd","upokorzenie","żal"]},
{id:172,lv:3,sex:"f",ctx:"Spotkanie ze znajomymi rodziców. 17-latka słyszy z kuchni, jak tata mówi, że ona jeszcze nie wie, co chce robić w życiu, i po wyjściu gości staje w drzwiach.",says:"Mówisz o mnie przy ludziach jak o problemie. «Jeszcze nie wie». Jakbym była zepsuta.",emo:"żal",dist:["upokorzenie","złość","wstyd"]},
{id:173,lv:3,sex:"m",ctx:"Po treningu mama podchodzi do trenera i przy całej drużynie pyta, czy 14-latek się stara. W drodze do domu on długo milczy.",says:"Zapytałaś trenera, czy się staram. Przy wszystkich. Teraz jestem ten, którego mama sprawdza.",emo:"wstyd",dist:["upokorzenie","złość","bezsilność"]},
{id:174,lv:3,sex:"f",ctx:"15-latka odprowadza koleżankę do drzwi. Tata na pożegnanie żartuje z jej nowej fryzury, a koleżanka wychodzi bez słowa.",says:"Zażartowałeś z jej włosów. Przy niej. Ona już tu nie wróci i nawet nie wiesz, co zrobiłeś.",emo:"złość",dist:["wstyd","żal","bezsilność"]},
{id:175,lv:3,sex:"m",ctx:"13-latek siedzi z tyłu w samochodzie. Mama przyszła po niego na urodziny kolegi pół godziny przed końcem i przez ten czas rozmawiała w kuchni z jego rodzicami.",says:"Opowiedziałaś im o mojej alergii i o tym, że śpię przy lampce. Wszyscy to słyszeli. Wszyscy.",emo:"wstyd",dist:["upokorzenie","złość","żal"]},
{id:176,lv:3,sex:"f",ctx:"15-latka wrzuciła zdjęcie z koleżankami. Pierwszy komentarz pod spodem jest od mamy, z serduszkami i „moja piękna córeczka”.",says:"Usuń to. Teraz. Wszyscy to widzą, a ja nie mogę zablokować własnej mamy.",emo:"upokorzenie",dist:["wstyd","złość","bezsilność"]},
{id:177,lv:3,sex:"m",ctx:"Dzień po wywiadówce. 15-latek wraca ze szkoły i zamiast do pokoju idzie prosto do mamy.",says:"Zapytałaś przy wszystkich rodzicach, czemu nie mam kolegów. Mama kumpla mu powiedziała, a on całej klasie.",emo:"upokorzenie",dist:["złość","wstyd","bezsilność"]},
// --- Presja na wyniki i przyszłość („to nie zawód”, codzienne sprawdzanie ocen) ---
{id:178,lv:3,sex:"m",ctx:"16-latek wraca ze szkoły. Tata wita go w drzwiach pytaniem o trójkę z angielskiego, którą pół godziny temu wpisano w Librusie.",says:"Zanim wejdę do domu, ty już wiesz. Nie muszę nic mówić, nigdy. Librus mówi za mnie.",emo:"bezsilność",dist:["złość","przytłoczenie","bunt"]},
{id:179,lv:3,sex:"f",ctx:"17-latka pokazuje tacie stronę kierunku grafika na uczelni. Tata mówi, że to nie jest zawód.",says:"Nie zawód. Jasne. Rysuję od ósmego roku życia, a ty widzisz w tym hobby na emeryturę.",emo:"żal",dist:["złość","odrzucenie","rozczarowanie"]},
{id:180,lv:3,sex:"m",ctx:"15-latek przynosi sprawdzian z chemii z piątką. Mama pyta, czy ktoś dostał szóstkę.",says:"Piątka. A ty pytasz o szóstkę. Nigdy dość.",emo:"rozczarowanie",dist:["żal","bezsilność","złość"]},
{id:181,lv:3,sex:"f",ctx:"Dzień wyników egzaminu ósmoklasisty. 14-latka wraca od koleżanki, mama jeszcze w drzwiach pyta: „Ile?”",says:"«Ile». Nie «jak było». Tylko «ile».",emo:"smutek",dist:["żal","złość","rozczarowanie"]},
{id:182,lv:3,sex:"m",ctx:"17-latek odczytuje z kalendarza na lodówce, że od wtorku ma korepetycje z matematyki, o których nikt z nim nie rozmawiał.",says:"Zapisałaś mnie bez pytania. Jak psa do weterynarza.",emo:"złość",dist:["bunt","bezsilność","niesprawiedliwość"]},
{id:183,lv:3,sex:"f",ctx:"Sobota. 16-latka stoi ubrana do wyjścia, mama właśnie powiedziała, że zostaje w domu, bo w poniedziałek ma sprawdzian.",says:"Umiem to. Mogę ci wyrecytować całość, a ty i tak «zostajesz». Co jeszcze mam zrobić?",emo:"niesprawiedliwość",dist:["złość","bezsilność","frustracja"]},
{id:184,lv:3,sex:"m",ctx:"18-latek po maturze mówi przy obiedzie, że złożył papiery na kulturoznawstwo. Ojciec odkłada widelec i zaczyna o medycynie.",says:"To moje życie. Nie twoja druga szansa na medycynę. Złożyłem i nie cofnę.",emo:"bunt",dist:["złość","bezsilność","żal"]},
// --- Porównywanie i faworyzowanie rodzeństwa ---
{id:185,lv:3,sex:"f",ctx:"15-latka pokazuje mamie dyplom z konkursu szkolnego. Mama mówi, że jej siostra w tym wieku była już w finale wojewódzkim.",says:"Zawsze ona. Przychodzę z czymś swoim i słyszę o niej. Jakby mnie nie było.",emo:"żal",dist:["niesprawiedliwość","zazdrość","złość"]},
{id:186,lv:3,sex:"m",ctx:"Przy kolacji tata chwali młodszego brata za czwórkę z dyktanda. 14-latek odsuwa talerz, w plecaku ma sprawdzian z piątką.",says:"On dostaje brawa za czwórkę. Ja przyniosłem piątkę i cisza. Nikt nawet nie zapytał.",emo:"zazdrość",dist:["niesprawiedliwość","żal","smutek"]},
{id:187,lv:3,sex:"f",ctx:"Goście w salonie. Mama opowiada o sukcesach starszej siostry i przechodzi do innego tematu, 16-latka wychodzi z pokoju.",says:"O niej dziesięć minut. O mnie zero, nawet nie «a to młodsza». Jakbym stała za szybą.",emo:"odrzucenie",dist:["zazdrość","żal","smutek"]},
{id:188,lv:3,sex:"m",ctx:"17-latek dostał odmowę weekendowego wyjazdu, na który jego starszy brat w tym samym wieku dostał zgodę.",says:"On mógł w moim wieku. Bo «on był odpowiedzialny». A ja co, jestem gorszy?",emo:"niesprawiedliwość",dist:["złość","zazdrość","żal"]},
{id:189,lv:3,sex:"m",ctx:"13-latek prosi o smartfon zamiast starego telefonu z klawiszami. Tata mówi, że jeszcze za wcześnie, choć jego siostra dostała swój w wieku dwunastu lat.",says:"Ona dostała smartfon na dwunaste urodziny. Ja mam trzynaście i «jeszcze za wcześnie». Jakie są zasady, bo ja ich nie znam?",emo:"złość",dist:["niesprawiedliwość","zazdrość","bunt"]},
{id:190,lv:3,sex:"m",ctx:"Wizyta u cioci. 15-latek słucha, jak mama wypytuje kuzyna o olimpiadę z matematyki, a potem pyta jego, czy on też by nie spróbował.",says:"Nie jestem nim. Nigdy nie będę. Możesz przestać patrzeć na mnie jak na gorszą wersję?",emo:"smutek",dist:["upokorzenie","zazdrość","żal"]},
// --- Złamane obietnice i nadszarpnięte zaufanie ---
{id:191,lv:3,sex:"m",ctx:"14-latek wraca z meczu, na który tata obiecał przyjść. Miejsce obok innych rodziców było puste.",says:"Obiecałeś. Strzeliłem gola i patrzyłem na trybuny.",emo:"rozczarowanie",dist:["żal","smutek","złość"]},
{id:192,lv:3,sex:"f",ctx:"16-latka opowiedziała mamie o kłótni z przyjaciółką pod warunkiem, że zostanie to między nimi. Dziś babcia zapytała ją o to przez telefon.",says:"Obiecałaś. «Zostanie między nami». Babcia wie, komu jeszcze powiedziałaś?",emo:"żal",dist:["złość","upokorzenie","bezsilność"]},
{id:193,lv:3,sex:"m",ctx:"17-latek trzeci raz pyta o obiecany kurs prawa jazdy, który miał zacząć trzy miesiące przed osiemnastką. Tata znów mówi: „może później”.",says:"Trzeci raz «może później». Mówiłeś «na pewno». Wszyscy w klasie już jeżdżą, a ja dalej czekam na «później».",emo:"frustracja",dist:["rozczarowanie","złość","bezsilność"]},
{id:194,lv:3,sex:"f",ctx:"Sobota rano. Tata odwołuje przez pracę wspólny wyjazd do kina i na pizzę, trzeci raz w tym miesiącu, 14-latka zdejmuje kurtkę.",says:"Trzeci raz. Już nawet nie jestem zdziwiona.",emo:"smutek",dist:["żal","rozczarowanie","tęsknota"]},
{id:195,lv:3,sex:"m",ctx:"15-latek przynosi świadectwo ze średnią, za którą mama obiecała podwyżkę kieszonkowego. Mama mówi, że teraz nie jest dobry moment.",says:"Umowa była jasna: cztery pięć, mam cztery sześć. Ja się wywiązałem, a ty nagle «nie ten moment».",emo:"niesprawiedliwość",dist:["złość","rozczarowanie","żal"]},
{id:196,lv:3,sex:"f",ctx:"17-latka wraca z wernisażu szkolnej wystawy, na której wisiały jej prace. Mama obiecała przyjść i dotarła po zakończeniu.",says:"Każdy miał kogoś. Każdy. Stałam przy swoich obrazach jak sprzedawczyni w pustym sklepie.",emo:"samotność",dist:["żal","rozczarowanie","smutek"]},

function hashDate(dateStr){
  // Simple deterministic hash from date string
  let h=0;
  for(let i=0;i<dateStr.length;i++){h=((h<<5)-h)+dateStr.charCodeAt(i);h|=0}
  return Math.abs(h);
}

function getDailyScene(){
  const today=new Date().toISOString().slice(0,10);
  const idx=hashDate(today+"uslyszmnie")%SCENARIOS_DB.length;
  const raw=SCENARIOS_DB[idx];
  return{
    id:raw.id, level:raw.lv, sex:raw.sex,
    situation:raw.ctx,
    teen_says:raw.says,
    date:today
  };
}

function getTimeUntilMidnight(){
  const now=new Date();
  const tomorrow=new Date(now);
  tomorrow.setDate(tomorrow.getDate()+1);
  tomorrow.setHours(0,0,0,0);
  return tomorrow-now;
}

function formatCountdown(ms){
  const h=Math.floor(ms/3600000);
  const m=Math.floor((ms%3600000)/60000);
  const s=Math.floor((ms%60000)/1000);
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function getDotdShareText(score,date,streakVal,sceneSays){
  const d=new Date(date);
  const monthNames=["sty","lut","mar","kwi","maj","cze","lip","sie","wrz","paź","lis","gru"];
  // Numer dnia od startu (jak Wordle)
  const dayZero=new Date("2026-01-01");
  const dayNum=Math.floor((d-dayZero)/(1000*60*60*24))+1;
  // Pasek — zielony do wyniku, szary reszta
  const bar=Array.from({length:10},(_,i)=>i<score?"🟩":"⬜").join("");
  let txt=`👂 Usłysz Mnie #${dayNum}\n${bar}  ${score}/10\n`;

  if(sceneSays){
    txt+=`\n„${sceneSays}”\nCo odpowiadasz nastolatkowi? 😏\n`;
  }
  txt+=`\nhttps://uslyszmnie.netlify.app`;
  return txt;
}

// fixPolish — siatka bezpieczeństwa dla feedbacku AI
// Literówki + sztuczne frazy → naturalne polskie odpowiedniki
// ══════════════════════════════════════════════════════════════
function fixPolish(obj){
  const typos=[
    [/\bTwója\b/g,"Twoja"],[/\bTwóją\b/g,"Twoją"],[/\bTwójej\b/g,"Twojej"],
    [/\bTwóje\b/g,"Twoje"],[/\bTwójego\b/g,"Twojego"],[/\bTwójemu\b/g,"Twojemu"],
    [/\btwója\b/g,"twoja"],[/\btwóją\b/g,"twoją"],[/\btwójej\b/g,"twojej"],
    [/\btwóje\b/g,"twoje"],[/\btwójego\b/g,"twojego"],[/\btwójemu\b/g,"twojemu"],
  ];
  const phrases=[
    // Samotność
    [/\bjest ci samotno\b/gi,"czujesz się sam"],
    [/\bjest ci bardzo samotno\b/gi,"czujesz się sam"],
    [/\bodczuwasz izolację\b/gi,"jakby cię nie było"],
    [/\bczujesz się wykluczony\b/gi,"zostawili cię z boku"],
    [/\bczujesz się wykluczona\b/gi,"zostawiły cię z boku"],
    [/\bdoświadczasz odrzucenia\b/gi,"odstawili cię"],
    // Złość
    [/\bodczuwasz frustrację\b/gi,"wkurza cię to"],
    [/\bczujesz frustrację\b/gi,"wkurza cię to"],
    [/\bto musi być frustrujące\b/gi,"to wkurzające"],
    [/\bczujesz gniew\b/gi,"jesteś wściekły"],
    [/\bodczuwasz złość\b/gi,"zły jesteś"],
    // Smutek
    [/\bto musi być trudne\b/gi,"to jest ciężkie"],
    [/\bto musi być bardzo trudne\b/gi,"to jest naprawdę ciężkie"],
    [/\bto musi być bolesne\b/gi,"to boli"],
    [/\bto musiało być bolesne\b/gi,"to bolało"],
    [/\bto musiało być niezwykle bolesne doświadczenie\b/gi,"to bolało"],
    [/\bto musiało być trudne\b/gi,"to było ciężkie"],
    [/\bodczuwasz smutek\b/gi,"jest ci ciężko"],
    [/\bczujesz pustkę\b/gi,"nic ci się nie chce"],
    // Bezsilność
    [/\bczujesz się bezsilny\b/gi,"nie masz już siły"],
    [/\bczujesz się bezsilna\b/gi,"nie masz już siły"],
    [/\bodczuwasz bezradność\b/gi,"nie wiesz co z tym zrobić"],
    [/\bczujesz się przytłoczony\b/gi,"za dużo tego na raz"],
    [/\bczujesz się przytłoczona\b/gi,"za dużo tego na raz"],
    [/\bdoświadczasz wyczerpania\b/gi,"padasz z nóg"],
    // Niesprawiedliwość
    [/\bczujesz się niesprawiedliwie potraktowany\b/gi,"to niesprawiedliwe"],
    [/\bczujesz się niesprawiedliwie potraktowana\b/gi,"to niesprawiedliwe"],
    [/\bodczuwasz niesprawiedliwość\b/gi,"to niesprawiedliwe"],
    // Strach
    [/\bodczuwasz lęk\b/gi,"boisz się"],
    [/\bczujesz niepokój\b/gi,"stresuje cię to"],
    [/\bdoświadczasz strachu\b/gi,"boisz się"],
    // Sztuczne konstrukcje
    [/\bodczuwasz\b/gi,"czujesz"],
    [/\bdoświadczasz\b/gi,"czujesz"],
    [/\bi samotnie\.?\s*$/gi,"i nikogo"],
    [/\bniezwykle bolesne\b/gi,"bardzo ciężkie"],
  ];
  function fixStr(s){
    if(typeof s!=="string")return s;
    for(const[re,rv]of typos)s=s.replace(re,rv);
    for(const[re,rv]of phrases)s=s.replace(re,rv);
    return s;
  }
  if(typeof obj==="string")return fixStr(obj);
  if(Array.isArray(obj))return obj.map(fixPolish);
  if(obj&&typeof obj==="object"){const r={};for(const k in obj)r[k]=fixPolish(obj[k]);return r}
  return obj;
}

// API CALL: ocena odpowiedzi i scenka z opisu (funkcja api na serwerze)
// Najwyżej 2 próby; ponowienie tylko po kłopocie z siecią, chwilowym błędzie serwera

class LimitError extends Error{constructor(scope){super("limit");this.scope=scope}}
const LIMIT_MSG=e=>e.scope==="all"
  ?"Aplikacja wykorzystała już dzisiejszy limit ocen. Zapraszamy jutro, scenki poczekają."
  :"Z tego połączenia wykorzystano już dzisiejszy limit ocen. Zapraszamy jutro, scenki poczekają.";
const feedbackReq=(sc,resp)=>({type:"feedback",level:[1,2,3].includes(+sc.level)?+sc.level:2,girl:isGirl(sc),situation:sc.situation,teen_says:sc.teen_says,response:resp});
const customReq=desc=>({type:"custom",description:desc});

async function callAPI(payload,attempt=1){
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),45000);
    let r;
    try{
      r=await fetch("/.netlify/functions/api",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        signal:controller.signal,
        body:JSON.stringify(payload)
      });
    }finally{clearTimeout(timeout)}
    if(r.status===429){const b=await r.json().catch(()=>({}));if(b.error==="limit")throw new LimitError(b.scope)}
    if(!r.ok)throw new Error(`API ${r.status}`);
    const d=await r.json();
    const t=d.content||"";
    const clean=t.replace(/```json|```/g,"").trim();
    const start=clean.indexOf("{");const end=clean.lastIndexOf("}");
    if(start===-1||end===-1)throw new Error("No JSON");
    let jsonStr=clean.slice(start,end+1);
    try{return fixPolish(JSON.parse(jsonStr))}catch(e1){
      let fix1=jsonStr.replace(/[„”“«»]/g,'\\"');
      try{return fixPolish(JSON.parse(fix1))}catch(e2){
        let fix2=jsonStr.replace(/[„”“«»‚‘’]/g,"'");
        try{return fixPolish(JSON.parse(fix2))}catch(e3){throw new Error("No JSON")}
      }
    }
  }catch(e){
    const retry=!(e instanceof LimitError)&&(e.name==="AbortError"||e instanceof TypeError||/^API 50[234]$/.test(e.message)||e.message==="No JSON");
    if(retry&&attempt<2){
      await new Promise(r=>setTimeout(r,1500+Math.random()*1000));
      return callAPI(payload,attempt+1);
    }
    throw e;
  }
}

// ── STREAK ──
function getStreak(saved){
  if(!saved?.lastDay)return{streak:0,lastDay:null};
  const today=new Date().toISOString().slice(0,10);
  const last=saved.lastDay;
  if(last===today)return{streak:saved.streak||1,lastDay:last};
  const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(last===yesterday)return{streak:(saved.streak||0)+1,lastDay:today};
  return{streak:1,lastDay:today};
}
function markToday(saved){
  const today=new Date().toISOString().slice(0,10);
  if(saved?.lastDay===today)return{streak:saved.streak||1,lastDay:today};
  const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(saved?.lastDay===yesterday)return{streak:(saved.streak||0)+1,lastDay:today};
  return{streak:1,lastDay:today};
}

  if(Notification.permission==="denied")return false;
  if(Notification.permission==="granted"){return false}
  if(notifState.asked===0&&totalScenarios>=3)return true;
  if(notifState.asked===1&&totalScenarios>=8)return true;
  return false;
}

// Przypomnienia wysyła serwer (funkcja push-daily o 20:00 czasu użytkownika).
// Telefon zapisuje subskrypcję push; confirm=true prosi serwer o powiadomienie próbne.
// Bez zmian (ten sam adres, ta sama strefa) telefon odzywa się do serwera najwyżej raz dziennie.
const PUSH_URL="/.netlify/functions/push";
const PUSH_SYNC_KEY="uslysz_mnie_push";
function b64ToBytes(v){const p="=".repeat((4-v.length%4)%4);const b=atob((v+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))}
function sameKey(buf,bytes){if(!buf)return false;const a=new Uint8Array(buf);return a.length===bytes.length&&a.every((x,i)=>x===bytes[i])}
async function subscribePush(confirm){
  if(!("serviceWorker" in navigator)||!("PushManager" in window))return false;
  await navigator.serviceWorker.register("/sw.js");
  const reg=await navigator.serviceWorker.ready;
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"Europe/Warsaw";
  const day=new Date().toDateString();
  let sub=await reg.pushManager.getSubscription();
  if(!confirm&&sub){try{const l=JSON.parse(localStorage.getItem(PUSH_SYNC_KEY)||"null");if(l&&l.ep===sub.endpoint&&l.tz===tz&&l.day===day)return true}catch(e){}}
  const r=await fetch(PUSH_URL);if(!r.ok)return false;
  const key=b64ToBytes((await r.json()).publicKey);
  if(sub&&!sameKey(sub.options&&sub.options.applicationServerKey,key)){await sub.unsubscribe();sub=null}
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
  const s=await fetch(PUSH_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subscription:sub.toJSON(),tz,confirm:!!confirm})});
  if(s.ok){try{localStorage.setItem(PUSH_SYNC_KEY,JSON.stringify({ep:sub.endpoint,tz,day}))}catch(e){}}
  return s.ok;
}

async function notifGranted(){
  try{if(navigator.permissions&&navigator.permissions.query){const st=await navigator.permissions.query({name:"notifications"});return st.state==="granted"}}catch(e){}
  return "Notification" in window&&Notification.permission==="granted";
}

async function requestNotifPermission(){
  if(!("Notification" in window))return false;
  try{
    const perm=await Notification.requestPermission();
    if(perm==="granted"){
      return await subscribePush(true);
    }
    return false;
  }catch(e){return false}
}

function computeBadgeData(stats,history,streak,dotd){
  const nines=history.filter(h=>h.score>=9).length;
  const tens=history.filter(h=>h.score>=10).length;
  const lv3high=history.filter(h=>h.lv===3&&h.score>=8).length;
  
  // Seria bez pułapki — trzeba liczyć z historii (brak trap info w historii, więc liczymy serie score>=5 jako proxy)
  // Lepsze rozwiązanie: dodajemy cleanStreak do persystowanych danych
  let cleanMax=0,cleanCur=0;
  // Historia jest od najnowszej, więc iterujemy od końca do początku
  for(let i=history.length-1;i>=0;i--){
    // Proxy: wynik >=6 zazwyczaj oznacza brak dominującej pułapki
    if(history[i].score>=6){cleanCur++; if(cleanCur>cleanMax)cleanMax=cleanCur}
    else{cleanCur=0}
  }
  
  // Ile dotd ukończono (zliczamy z historii DOTD — potrzebujemy nowego countera)
  let dotdCount=0;
  try{const raw=localStorage.getItem(BADGE_KEY);if(raw){const b=JSON.parse(raw);dotdCount=b._dotdCount||0}}catch(e){}
  
  const lvCounts={1:history.filter(h=>h.lv===1).length,2:history.filter(h=>h.lv===2).length,3:history.filter(h=>h.lv===3).length};
  
  const last10=history.slice(0,10);
  const last10avg=last10.length>=10?last10.reduce((a,h)=>a+h.score,0)/10:0;
  
  return{stats,nines,tens,lv3high,cleanMax,streak:streak?.streak||0,dotdCount,lvCounts,last10avg};
}

const INSTALL_KEY="uslysz_mnie_install";
function isStandalone(){try{return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true}catch(e){return false}}
function isIOS(){const ua=navigator.userAgent||"";return /iphone|ipad|ipod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
function isAndroid(){return /Android/i.test(navigator.userAgent||"")}
function iosCanAddToHome(){const ua=navigator.userAgent||"";return isIOS()&&/Safari\//.test(ua)&&!/FBAN|FBAV|FB_IAB|Instagram|GSA\//.test(ua)}
let installOffered=false; // okienko już było w tym uruchomieniu
function installSnoozed(){try{const t=+localStorage.getItem(INSTALL_KEY)||0;return Date.now()-t<3*86400000}catch(e){return false}}
const ShareIcon=()=><svg className="inst-share" viewBox="0 0 24 24" fill="none" stroke="#007aff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M6 11v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8"/></svg>;

function InstallBanner(){
  const[bip,setBip]=useState(()=>window.__bip);
  const[ready,setReady]=useState(false);
  const[closed,setClosed]=useState(()=>installOffered);
  useEffect(()=>{
    const f=()=>setBip(window.__bip);
    window.addEventListener("bip-change",f);
    const t=setTimeout(()=>setReady(true),1200);
    return()=>{window.removeEventListener("bip-change",f);clearTimeout(t)};
  },[]);
  const show=ready&&!closed&&!isStandalone()&&!installSnoozed()&&((!!bip&&isAndroid())||iosCanAddToHome());
  useEffect(()=>{if(show)installOffered=true},[show]);
  if(!show)return null;
  const later=()=>{try{localStorage.setItem(INSTALL_KEY,String(Date.now()))}catch(e){};setClosed(true)};
  const install=async()=>{
    const e=bip;window.__bip=null;setBip(null);
    try{e.prompt();const c=await e.userChoice;if(c&&c.outcome==="accepted"){setClosed(true);return}}catch(err){}
    later();
  };
  return <div className="inst-sheet" role="dialog" aria-label="Instalacja aplikacji">
    <div className="inst-head">
      <img src="/icons/icon-192.png" alt=""/>
      <div>
        <div className="inst-title">Zainstaluj Usłysz Mnie</div>

    <div className="inst-btns">
      {bip?<><button className="inst-later" onClick={later}>Nie teraz</button><button className="inst-yes" onClick={install}>Zainstaluj</button></>
      :<button className="inst-yes" onClick={later}>Rozumiem</button>}
    </div>
  </div>;
}

      {fb.teen_reaction&&<div className="teen-react fd2">
        <div className="teen-avatar">{teenFace(fb.score)}</div>
        <div className="teen-bubble">
          <div className="teen-name">{isGirl(scene)?"Nastolatka":"Nastolatek"}</div>
          {teenTyping?<div className="typing-dots"><span/><span/><span/></div>
          :<p>{fb.teen_reaction}</p>}
        </div>
      </div>}
      {fb.perfect_note&&<div className="pb fd3"><span className="ic">✨</span><p>{fb.perfect_note}</p></div>}
      {fb.trap_detected&&<div className="trb fd3"><span className="ic">⚡</span><span>Pułapka: {fb.trap_detected}</span></div>}
      <div className="eb fd4"><div className="ebl">Twoja odpowiedź:</div><p className="ebt">„{pr}”</p></div>
      <div className="fd5"><Sec icon="👍" title="Co działa" startOpen><p className="secb">{fb.what_works}</p></Sec></div>
      <div className="fd5"><Sec icon="👀" title="Na co uważać"><p className="secb">{fb.watch_out}</p></Sec></div>
      <div className="rfb fd6"><span className="ic">💭</span><p>{fb.reflection_question}</p></div>
      <div className="fd7"><Sec icon="💡" title="Podpowiedź">{scene?.level===3?
        <div className="sgl"><div className="sgi" style={{flexDirection:"column",gap:"4px"}}><span className="sglt" style={{fontStyle:"normal",fontSize:"16px",lineHeight:"1.6"}}>{fb.suggestions.best||fb.suggestions.warm||fb.suggestions.naming}</span></div></div>
        :<div className="sgl">
        <div className="sgi"><span className="sgla">Nazwij uczucie</span><span className="sglt">{fb.suggestions.naming}</span></div>
        <div className="sgi"><span className="sgla">Echo</span><span className="sglt">{fb.suggestions.warm}</span></div>
      </div>}</Sec></div>
      {note&&<div className="pb fd7" style={{background:"#fef9e7",borderLeft:"3.5px solid #eab020"}}><p style={{color:"#6b5600"}}>{note}</p></div>}

      {/* ═══ KARTA UDOSTĘPNIANIA — SCENKA DNIA ═══ */}
      {dotdMode&&fb.score>=9&&<div className="share-card fd8">
        <div style={{fontSize:"12px",color:"rgba(255,255,255,.45)",fontFamily:"'Source Sans 3',sans-serif",fontWeight:700,textTransform:"uppercase",letterSpacing:"1.5px",marginBottom:"14px"}}>👂 Usłysz Mnie · Scenka Dnia</div>
        
        <div style={{fontSize:"22px",letterSpacing:"1px",marginBottom:"4px"}}>
          {Array.from({length:10},(_, i)=>i<fb.score?"🟩":"⬜").join("")}
        </div>
        
        <div className="share-grid">
          <div className="share-cell"><div className="val">{fb.score}/10</div><div className="lbl">wynik</div></div>
          <div className="share-divider"/>
          <div className="share-cell"><div className="val">{le(scene?.level)}</div><div className="lbl">poziom</div></div>
          <div className="share-divider"/>
          <div className="share-cell"><div className="val">{fb.trap_detected?"⚡":"✅"}</div><div className="lbl">{fb.trap_detected?"pułapka":"czysto"}</div></div>
          {streak.streak>=2&&<><div className="share-divider"/><div className="share-cell"><div className="val">🔥{streak.streak}</div><div className="lbl">seria</div></div></>}
        </div>
        
        <p style={{fontSize:"14px",color:"rgba(255,255,255,.6)",fontStyle:"italic",margin:"8px 0 4px",lineHeight:"1.4"}}>„{scene?.teen_says||dailyScene?.teen_says}”<br/><span style={{fontStyle:"normal",fontSize:"13px"}}>Co odpowiadasz nastolatkowi? 😏</span></p>
        
        <button className={`share-copy ${copied?"share-copied":""}`} onClick={shareDotd}>
          {copied?"✅ Skopiowano!":"📤 Pochwal się wynikiem"}
        </button>
      </div>}

      {/* ═══ BANER POWIADOMIEŃ ═══ */}
      {showNotifBanner&&!notifState.enabled&&<div className="notif-banner">
        <div className="notif-banner-title">🔔 Chcesz codzienne przypomnienie?</div>
        <p className="notif-banner-text">Jedno powiadomienie wieczorem — żebyś nie zgubił serii i nie przegapił Scenki Dnia.</p>
        <div className="notif-btns">
          <button className="notif-yes" onClick={async()=>{
            const ok=await requestNotifPermission();
            const ns={asked:notifState.asked+1,enabled:ok};
            saveNotifState(ns);setNotifState(ns);
            setShowNotifBanner(false);
            if(ok)setNotifJustEnabled(true);else setNotifFailed(true);
          }}>Tak, przypominaj</button>
          <button className="notif-later" onClick={()=>{
            const ns={...notifState,asked:notifState.asked+1};
            saveNotifState(ns);setNotifState(ns);
            setShowNotifBanner(false);
          }}>Nie teraz</button>
        </div>
      </div>}
      {notifJustEnabled&&<div className="notif-done">✅ Powiadomienia włączone!</div>}
      {notifFailed&&<div className="notif-fail">Nie udało się włączyć przypomnień. Na iPhonie działają w aplikacji dodanej do ekranu początkowego.</div>}

      <div className="btns fd8">
        {dotdMode?<button className="bp" onClick={goHome}>Wróć do menu →</button>
        :customMode?<button className="bp" onClick={goHome}>Wróć do menu →</button>
        :<>
          <button className="bp" onClick={()=>{setNote(null);next()}}>Następna sytuacja →</button>
          {fb&&fb.score<=6&&<button className="bs" onClick={retry}>Spróbuj ponownie</button>}
          {fb&&fb.score>=7&&fb.score<=8&&<button className="bs" style={{borderColor:"var(--teal)",color:"var(--teal)"}} onClick={retry}>Udoskonal odpowiedź</button>}
        </>}
      </div>
    </div>}

    <EmotionPanel open={emoPanelOpen} onClose={()=>setEmoPanelOpen(false)} />
    {(scr==="scene"||scr==="feedback")&&!loading&&!showHelp&&<button className="emo-fab" onClick={()=>setEmoPanelOpen(true)} title="Mapa emocji">🧭</button>}

    {!showHelp&&scr==="custom"&&!loading&&<div className="fw fu">
      <div style={{textAlign:"center",padding:"10px 0 16px"}}>
        <div style={{fontSize:"36px",marginBottom:"8px"}}>✏️</div>
        <h2 style={{fontSize:"20px",color:"var(--acd)",marginBottom:"6px"}}>Moja sytuacja</h2>
      </div>
      <div className="custom-intro"><p>Opisz, co się wydarzyło — co powiedział Twój nastolatek, w jakiej sytuacji. AI stworzy scenkę treningową, na którą będziesz mógł odpowiedzieć i dostać feedback.</p></div>
      <div className="ra">
        <label className="rl">Co powiedział Twój nastolatek? Co się działo?</label>
        <textarea value={customTxt} onChange={e=>setCustomTxt(e.target.value)} placeholder="Np. Mój 15-letni syn wrócił ze szkoły wściekły i powiedział, że nienawidzi nauczyciela..." maxLength={1500} className="ta" rows={4}/>
        <button className="snb" disabled={!customTxt.trim()||loading} onClick={submitCustom}>Stwórz scenkę →</button>
      </div>
      <div style={{textAlign:"center",marginTop:"16px"}}>
        <button className="menu-link" onClick={goHome} style={{display:"inline-flex"}}>← Wróć do menu</button>
      </div>
    </div>}

    {!showHelp&&scr==="history"&&<div className="fw fu">
      <div style={{textAlign:"center",padding:"10px 0 16px"}}>
        <div style={{fontSize:"36px",marginBottom:"8px"}}>📋</div>
        <h2 style={{fontSize:"20px",color:"var(--acd)",marginBottom:"6px"}}>Historia odpowiedzi</h2>
        <p style={{fontSize:"13px",color:"var(--tm)"}}>{history.length} odpowiedzi</p>
      </div>
      {history.length===0&&<div className="hist-empty">Jeszcze nie masz historii. Zacznij ćwiczyć!</div>}
      <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
        {history.map((h,i)=><div key={i} className="hist-item fu">
          <div className="hist-meta">
            <span className="hist-date">{h.date} · Poziom {h.lv}</span>
            <span className="hist-score" style={{backgroundColor:scol(h.score)}}>{h.score}</span>
          </div>
          <div className="hist-ctx">💬 „{h.says}”</div>
          <div className="hist-resp">→ „{h.resp}”</div>
        </div>)}
      </div>
      <div style={{textAlign:"center",marginTop:"20px"}}>
        <button className="menu-link" onClick={goHome} style={{display:"inline-flex"}}>← Wróć do menu</button>
      </div>
    </div>}

    {!showHelp&&scr==="summary"&&<div className="fw fu">
      <div style={{textAlign:"center",padding:"20px 0 10px"}}>
        <div style={{fontSize:"48px",marginBottom:"12px"}}>👏</div>
        <h2 style={{fontSize:"22px",color:"var(--acd)",marginBottom:"6px"}}>Podsumowanie</h2>
        <p style={{fontSize:"15px",color:"var(--tm)"}}>Masz za sobą {stats.t} scenek!</p>
      </div>
      <div className="stb" style={{borderBottom:"none",marginBottom:"0"}}>
        <div className="si"><span className="sn">{stats.t}</span><span className="sl2">scenek</span></div>
        <div className="si"><span className="sn">{(stats.ts/stats.t).toFixed(1)}</span><span className="sl2">średnia</span></div>
        <div className="si"><span className="sn">{stats.b}</span><span className="sl2">najlepsza</span></div>
      </div>
      {topTrap&&<div className="eb fu1"><div className="ebl">Najczęstsza pułapka</div><p className="ebt">{topTrap[0]} ({topTrap[1]}×)</p></div>}
      {(stats.ts/stats.t)>=7.5&&<div className="pb fu1"><span className="ic">✨</span><p>Świetna robota! Empatia to jest to.</p></div>}
      {(stats.ts/stats.t)>=5&&(stats.ts/stats.t)<7.5&&<div className="pb fu1" style={{background:"var(--wm)"}}><span className="ic">💪</span><p style={{color:"var(--ts)"}}>Dobry kierunek. Z każdą scenką idzie lepiej.</p></div>}
      {(stats.ts/stats.t)<5&&<div className="pb fu1" style={{background:"var(--wm)"}}><span className="ic">🌱</span><p style={{color:"var(--ts)"}}>To dopiero początek. Samo ćwiczenie to już dużo.</p></div>}
      <div className="btns fu2">
        <button className="bp" onClick={()=>getScene(lv)}>Ćwiczę dalej →</button>
        <button className="bp bp-ghost" onClick={goHome}>Wróć do menu</button>
      </div>
    </div>}

    {/* ═══ TOAST NOWEJ ODZNAKI ═══ */}
    {badgeToast&&<div className="badge-new-toast">{badgeToast.icon} Nowa odznaka: {badgeToast.name}!</div>}
  </>)}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
<script>
// Szybki start: kod aplikacji (JSX) kompiluje się raz, a wynik zostaje w pamięci telefonu.
// Przy następnych uruchomieniach Babel nie jest pobierany ani uruchamiany.
// Każda zmiana kodu zmienia odcisk, więc nowa wersja kompiluje się sama.
(function(){
  var src=document.getElementById("app-src").textContent;
  var h=2166136261;for(var i=0;i<src.length;i++){h^=src.charCodeAt(i);h=Math.imul(h,16777619)}
  var key="uslysz_mnie_build_"+(h>>>0).toString(36)+"_"+src.length;
  function run(code){var s=document.createElement("script");s.text=code;document.body.appendChild(s)}
  var cached=null;try{cached=localStorage.getItem(key)}catch(e){}
  if(cached){run(cached);return}
  var b=document.createElement("script");
  b.src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js";b.crossOrigin="anonymous";
  b.onload=function(){
    var code=Babel.transform(src,{presets:["react"]}).code;
    try{
      for(var j=localStorage.length-1;j>=0;j--){var k=localStorage.key(j);if(k&&k.indexOf("uslysz_mnie_build_")===0&&k!==key)localStorage.removeItem(k)}
      localStorage.setItem(key,code);
    }catch(e){}
    run(code);
  };
  document.body.appendChild(b);
})();
</script>
</body>
</html>
